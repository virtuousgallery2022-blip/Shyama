<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shyama Luxury Solutions</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        obsidian: "#0a0a0a",
                        gold: { light: "#E5C76B", DEFAULT: "#D4AF37", dark: "#B08D26" },
                        champagne: "#F7E7CE",
                        charcoal: "#1a1a1a",
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Montserrat"', 'sans-serif'],
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                        'float-slow': 'float 10s ease-in-out infinite',
                        'float-fast': 'float 4s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-20px)' },
                        }
                    },
                    backgroundImage: {
                        'gold-gradient': 'linear-gradient(135deg, #D4AF37 0%, #F7E7CE 50%, #B08D26 100%)',
                        'dark-gradient': 'linear-gradient(180deg, #0a0a0a 0%, #1a1a1a 100%)',
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <style>
        body {
            background-color: #0a0a0a;
            color: #F7E7CE;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            scroll-behavior: smooth;
        }
        h1, h2, h3, h4, h5, h6 { font-family: 'Playfair Display', serif; }
        .glass {
            background: rgba(26, 26, 26, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(212, 175, 55, 0.1);
        }
        .glass-gold {
            background: rgba(212, 175, 55, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 175, 55, 0.2);
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background-color: #0a0a0a; }
        ::-webkit-scrollbar-thumb { background-color: #D4AF37; border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background-color: #E5C76B; }
        .magnetic-btn { transition: transform 0.3s cubic-bezier(0.23, 1, 0.32, 1); }
        .magnetic-btn:hover { box-shadow: 0 0 25px rgba(212, 175, 55, 0.4); }
    </style>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    
    <!-- Babel (for JSX) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect } = React;
        const { motion, useScroll, useTransform, AnimatePresence } = window.Motion;

        // Mock Icons
        const PhoneIcon = () => <i data-lucide="phone" className="w-4 h-4"></i>;
        const MapPinIcon = () => <i data-lucide="map-pin" className="text-gold w-6 h-6"></i>;
        const ExpandIcon = () => <i data-lucide="expand" className="text-gold/30 w-5 h-5"></i>;
        const ArrowRightIcon = () => <i data-lucide="arrow-right" className="w-4 h-4"></i>;
        const ChevronDownIcon = ({ className }) => <i data-lucide="chevron-down" className={className}></i>;

        // Navbar Component
        const Navbar = () => {
            const [isScrolled, setIsScrolled] = useState(false);
            useEffect(() => {
                const handleScroll = () => setIsScrolled(window.scrollY > 50);
                window.addEventListener('scroll', handleScroll);
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);
            return (
                <nav className={`fixed top-0 left-0 w-full z-50 transition-all duration-500 ${isScrolled ? 'py-4 glass shadow-2xl' : 'py-8 bg-transparent'}`}>
                    <div className="container mx-auto px-6 flex justify-between items-center">
                        <motion.div initial={{ opacity: 0, x: -20 }} animate={{ opacity: 1, x: 0 }} className="text-2xl font-serif font-bold text-gold tracking-tighter">
                            SHYAMA <span className="text-champagne font-light">LUXURY</span>
                        </motion.div>
                        <div className="hidden md:flex space-x-8 items-center font-sans text-sm tracking-widest uppercase">
                            {['Home', 'About', 'Projects', 'Contact'].map((item) => (
                                <a key={item} href={`#${item.toLowerCase()}`} className="hover:text-gold transition-colors duration-300 relative group">
                                    {item}
                                    <span className="absolute -bottom-1 left-0 w-0 h-[1px] bg-gold transition-all duration-300 group-hover:w-full"></span>
                                </a>
                            ))}
                        </div>
                        <motion.button whileHover={{ scale: 1.05 }} whileTap={{ scale: 0.95 }} className="magnetic-btn flex items-center space-x-2 bg-gold text-obsidian px-6 py-2 rounded-sm font-bold text-sm">
                            <PhoneIcon /><span>+91 Contact Us</span>
                        </motion.button>
                    </div>
                </nav>
            );
        };

        // Hero Component
        const Hero = () => {
            const { scrollY } = useScroll();
            const y1 = useTransform(scrollY, [0, 500], [0, 200]);
            const opacity = useTransform(scrollY, [0, 300], [1, 0]);
            return (
                <section id="home" className="relative h-screen flex items-center justify-center overflow-hidden">
                    <motion.div style={{ y: y1 }} className="absolute inset-0 z-0">
                        <div className="absolute inset-0 bg-black/50 z-10"></div>
                        <img src="./public/assets/hero-bg.png" alt="Luxury Villa" className="w-full h-[120%] object-cover scale-110" />
                    </motion.div>
                    <div className="absolute inset-0 z-10 pointer-events-none">
                        {[...Array(20)].map((_, i) => (
                            <div key={i} className="absolute bg-gold/20 rounded-full animate-float-slow"
                                style={{ width: Math.random() * 6 + 2 + 'px', height: Math.random() * 6 + 2 + 'px', left: Math.random() * 100 + '%', top: Math.random() * 100 + '%', animationDelay: Math.random() * 5 + 's', opacity: Math.random() * 0.5 }}
                            ></div>
                        ))}
                    </div>
                    <div className="container mx-auto px-6 relative z-20 text-center">
                        <motion.div initial={{ opacity: 0, y: 50 }} animate={{ opacity: 1, y: 0 }} transition={{ duration: 1, delay: 0.2 }} style={{ opacity }}>
                            <h1 className="text-5xl md:text-8xl font-serif mb-6 leading-tight">Shyama <span className="text-gold italic">Luxury</span> Solutions</h1>
                            <p className="text-xl md:text-2xl text-champagne/80 font-sans max-w-3xl mx-auto mb-10 tracking-wide font-light">Build Your Future with Trusted Luxury Real Estate Partners</p>
                            <div className="flex flex-col md:flex-row items-center justify-center space-y-4 md:space-y-0 md:space-x-6">
                                <motion.button whileHover={{ scale: 1.05, boxShadow: '0 0 30px rgba(212, 175, 55, 0.5)' }} className="bg-gold text-obsidian px-10 py-4 font-bold rounded-sm tracking-widest transition-all">DISCOVER PREMIUM PLOTS</motion.button>
                                <motion.button whileHover={{ scale: 1.05, backgroundColor: 'rgba(212, 175, 55, 0.1)' }} className="border border-gold text-gold px-10 py-4 font-bold rounded-sm tracking-widest transition-all">WELCOME TO SHYAMA LUXURY</motion.button>
                            </div>
                        </motion.div>
                    </div>
                    <motion.div animate={{ y: [0, 10, 0] }} transition={{ repeat: Infinity, duration: 2 }} className="absolute bottom-10 left-1/2 -translate-x-1/2 z-20">
                        <div className="w-[1px] h-20 bg-gradient-to-b from-transparent via-gold to-transparent"></div>
                    </motion.div>
                </section>
            );
        };

        // About Component
        const About = () => {
            const stats = [{ label: 'Years of Experience', value: '6+' }, { label: 'Premium Plot Areas', value: '120+' }, { label: 'Happy Families', value: '5,000+' }, { label: 'Ongoing Projects', value: '20+' }];
            return (
                <section id="about" className="py-32 relative bg-charcoal">
                    <div className="container mx-auto px-6">
                        <div className="flex flex-col lg:flex-row items-center gap-16">
                            <motion.div initial={{ opacity: 0, x: -50 }} whileInView={{ opacity: 1, x: 0 }} viewport={{ once: true }} transition={{ duration: 0.8 }} className="lg:w-1/2">
                                <h2 className="text-gold text-sm tracking-[0.3em] uppercase mb-4">Our Legacy</h2>
                                <h3 className="text-4xl md:text-6xl mb-8 leading-tight">Live Smarter, Live Better at <br/><span className="text-gold italic">Shyama Luxury Solutions</span></h3>
                                <p className="text-champagne/70 text-lg leading-relaxed mb-12 max-w-xl">We help you own your future—today. With years of trust and excellence in the luxury real estate industry, we specialize in premium residential plots, luxury villas, and commercial lands. Our commitment is built on transparency, trust, and long-term value, backed by all legal approvals.</p>
                            </motion.div>
                            <div className="lg:w-1/2 grid grid-cols-2 gap-6 relative">
                                {stats.map((stat, index) => (
                                    <motion.div key={index} initial={{ opacity: 0, y: 50 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} transition={{ duration: 0.6, delay: index * 0.1 }} className="glass-gold p-8 rounded-sm text-center animate-float" style={{ animationDelay: `${index * 0.5}s` }}>
                                        <div className="text-4xl md:text-5xl font-serif text-gold mb-2">{stat.value}</div>
                                        <div className="text-champagne/60 text-sm tracking-widest uppercase">{stat.label}</div>
                                    </motion.div>
                                ))}
                                <div className="absolute -top-20 -right-20 w-64 h-64 bg-gold/10 blur-[100px] rounded-full"></div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };

        // Projects Component
        const Projects = () => {
            const projects = [
                { title: "Vasundhara Nagar 2", location: "Ajmer Road", specs: "80 - 800 sq. yd.", desc: "Premium plots near Ajmer Road", cta: "Explore Full Project" },
                { title: "Kedia Parwati Meadows", location: "Kalwar Road", specs: "100 - 165 sq. yd.", desc: "Premium residential plots at Kalwar Road", cta: "View Project Details" },
                { title: "Gokul Dham Farmhouse", location: "Begas", specs: "500 - 818 sq. yd.", desc: "Luxury farmhouse plots near Begas", cta: "Explore Full Project" }
            ];
            return (
                <section id="projects" className="py-32 bg-obsidian overflow-hidden">
                    <div className="container mx-auto px-6">
                        <div className="text-center mb-20">
                            <motion.h2 initial={{ opacity: 0, y: 20 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} className="text-4xl md:text-6xl mb-6">Explore Our Current <br/><span className="text-gold italic">Luxury Developments</span></motion.h2>
                            <div className="w-24 h-[1px] bg-gold mx-auto"></div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-10">
                            {projects.map((project, index) => (
                                <motion.div key={index} initial={{ opacity: 0, y: 100 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} transition={{ duration: 0.8, delay: index * 0.2 }} whileHover={{ scale: 1.02, transition: { duration: 0.3 } }} className="group relative animate-float-slow" style={{ animationDelay: `${index * 1.5}s` }}>
                                    <div className="glass p-10 h-full border border-gold/10 group-hover:border-gold/40 transition-all duration-500 shadow-xl hover:shadow-gold/10">
                                        <div className="flex justify-between items-start mb-8"><div className="p-3 bg-gold/10 rounded-sm"><MapPinIcon /></div><ExpandIcon /></div>
                                        <h3 className="text-2xl mb-2 font-serif group-hover:text-gold transition-colors">{project.title}</h3>
                                        <p className="text-gold/80 text-sm tracking-widest uppercase mb-6">{project.location}</p>
                                        <p className="text-champagne/60 mb-8 font-light italic h-12">"{project.desc}"</p>
                                        <div className="flex items-center space-x-2 text-champagne/40 text-sm mb-10 pb-10 border-b border-gold/10"><span className="font-bold text-champagne/80">{project.specs}</span></div>
                                        <motion.button whileHover={{ x: 5 }} className="flex items-center space-x-3 text-gold text-sm tracking-[0.2em] uppercase font-bold"><span>{project.cta}</span><ArrowRightIcon /></motion.button>
                                    </div>
                                </motion.div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        // Upcoming Component
        const Upcoming = () => {
            return (
                <section className="py-24 relative overflow-hidden">
                    <div className="absolute inset-0 bg-gold/5 pointer-events-none"></div>
                    <div className="container mx-auto px-6">
                        <motion.div initial={{ opacity: 0, scale: 0.95 }} whileInView={{ opacity: 1, scale: 1 }} viewport={{ once: true }} className="border border-gold/30 p-12 md:p-20 text-center relative overflow-hidden">
                            <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-[15vw] font-serif text-gold/5 whitespace-nowrap pointer-events-none uppercase tracking-[0.5em]">Coming Soon</div>
                            <div className="relative z-10">
                                <h2 className="text-3xl md:text-5xl font-serif mb-6">Premium Plots Coming Soon</h2>
                                <p className="text-champagne/70 text-lg mb-10 max-w-2xl mx-auto italic">Reserve Early for Best Deals. Secure your ideal plot before prices rise.</p>
                                <motion.button whileHover={{ scale: 1.05, boxShadow: '0 0 40px rgba(212, 175, 55, 0.3)' }} whileTap={{ scale: 0.95 }} className="bg-gold-gradient text-obsidian px-12 py-5 font-bold tracking-[0.3em] uppercase text-sm shadow-2xl">Join the Priority List !</motion.button>
                            </div>
                        </motion.div>
                    </div>
                </section>
            );
        };

        // FAQ Component
        const FAQ = () => {
            const [openIndex, setOpenIndex] = useState(null);
            const faqs = [
                { q: "Are all Shyama Luxury Solutions projects JDA and RERA approved?", a: "Yes, all our listed projects are fully approved, ensuring legal transparency and buyer confidence." },
                { q: "What is the minimum plot size available?", a: "Our plot sizes start from approximately 65 sq. yd., depending on the project." },
                { q: "Do you offer loan assistance?", a: "Yes, we assist buyers with easy loan processing through leading banks, with up to 80% financing." },
                { q: "Is there post-sale customer support?", a: "Yes, we provide excellent post-sale support including documentation help and possession updates." }
            ];
            return (
                <section className="py-32 bg-charcoal">
                    <div className="container mx-auto px-6 max-w-4xl">
                        <div className="text-center mb-16"><motion.h2 initial={{ opacity: 0, y: 20 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} className="text-4xl md:text-5xl mb-6 text-gold font-serif">Frequently Asked Questions</motion.h2></div>
                        <div className="space-y-4">
                            {faqs.map((faq, index) => (
                                <motion.div key={index} initial={{ opacity: 0, y: 20 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} transition={{ delay: index * 0.1 }} className="border border-gold/20 bg-obsidian/50">
                                    <button onClick={() => setOpenIndex(openIndex === index ? null : index)} className="w-full flex justify-between items-center p-6 text-left focus:outline-none group">
                                        <span className="font-sans text-lg text-champagne/90 group-hover:text-gold transition-colors">{faq.q}</span>
                                        <ChevronDownIcon className={`text-gold transition-transform duration-300 ${openIndex === index ? 'rotate-180' : ''}`} />
                                    </button>
                                    <AnimatePresence>
                                        {openIndex === index && (
                                            <motion.div initial={{ height: 0, opacity: 0 }} animate={{ height: 'auto', opacity: 1 }} exit={{ height: 0, opacity: 0 }} className="overflow-hidden">
                                                <div className="p-6 pt-0 text-champagne/60 font-light border-t border-gold/10">{faq.a}</div>
                                            </motion.div>
                                        )}
                                    </AnimatePresence>
                                </motion.div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        // Footer Component
        const Footer = () => {
            return (
                <footer id="contact" className="bg-obsidian border-t border-gold/10 pt-20 pb-10">
                    <div className="container mx-auto px-6">
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-12 mb-16">
                            <div className="col-span-1 md:col-span-2 lg:col-span-1">
                                <h3 className="text-2xl font-serif text-gold mb-6 tracking-tighter">SHYAMA <span className="text-champagne font-light">LUXURY</span></h3>
                                <p className="text-champagne/60 text-sm leading-relaxed mb-6">Building trust and delivering excellence in luxury real estate. Your partner in securing the perfect future.</p>
                            </div>
                            <div>
                                <h4 className="text-gold tracking-[0.2em] uppercase text-sm mb-6">Quick Links</h4>
                                <ul className="space-y-3 text-champagne/70 text-sm">
                                    {['Home', 'About Us', 'Projects', 'Contact'].map(link => (
                                        <li key={link}><a href={`#${link.toLowerCase().replace(' ', '')}`} className="hover:text-gold transition-colors">{link}</a></li>
                                    ))}
                                </ul>
                            </div>
                            <div>
                                <h4 className="text-gold tracking-[0.2em] uppercase text-sm mb-6">Services</h4>
                                <ul className="space-y-3 text-champagne/70 text-sm"><li>Premium Plots</li><li>Luxury Villas</li><li>Commercial Lands</li><li>Loan Assistance</li></ul>
                            </div>
                            <div>
                                <h4 className="text-gold tracking-[0.2em] uppercase text-sm mb-6">Exclusive Offers</h4>
                                <p className="text-champagne/60 text-sm mb-4">Sign Up for project updates and early access – straight to your inbox.</p>
                                <form className="space-y-3" onSubmit={e => e.preventDefault()}>
                                    <input type="text" placeholder="Name" className="w-full bg-charcoal border border-gold/20 p-3 text-sm text-champagne focus:outline-none focus:border-gold/60 transition-colors" />
                                    <input type="email" placeholder="Email" className="w-full bg-charcoal border border-gold/20 p-3 text-sm text-champagne focus:outline-none focus:border-gold/60 transition-colors" />
                                    <button className="w-full bg-gold text-obsidian font-bold uppercase tracking-widest text-sm p-3 hover:bg-gold-light transition-colors">Subscribe</button>
                                </form>
                            </div>
                        </div>
                        <div className="border-t border-gold/10 pt-8 flex flex-col md:flex-row justify-between items-center text-champagne/40 text-xs">
                            <p>Copyright © 2026 Shyama Luxury Solutions. All Rights Reserved.</p>
                            <div className="flex space-x-6 mt-4 md:mt-0"><a href="#" className="hover:text-gold">Privacy Policy</a><a href="#" className="hover:text-gold">Terms & Conditions</a></div>
                        </div>
                    </div>
                </footer>
            );
        };

        // App Component
        const App = () => {
            useEffect(() => { lucide.createIcons(); }, []);
            return (
                <div className="bg-obsidian min-h-screen">
                    <Navbar />
                    <Hero />
                    <About />
                    <Projects />
                    <Upcoming />
                    <FAQ />
                    <Footer />
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
